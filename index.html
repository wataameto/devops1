<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☁️ DOP-C02 練習問題</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      max-width: 720px;
      width: 100%;
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #f7971e, #ffd200, #21d4fd, #b721ff);
    }

    .home-header { text-align: center; margin-bottom: 32px; }
    .home-header .logo { font-size: 3rem; margin-bottom: 8px; }
    .home-header h1 { font-size: 1.8rem; color: #2d3748; font-weight: 800; margin-bottom: 6px; }
    .home-header p  { color: #718096; font-size: 0.95rem; }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    .test-card {
      border-radius: 16px;
      padding: 24px 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
      border: none;
      color: #fff;
    }

    .test-card:nth-child(1) { background: linear-gradient(135deg, #f7971e, #ffd200); color: #2d3748; }
    .test-card:nth-child(2) { background: linear-gradient(135deg, #21d4fd, #b721ff); }
    .test-card:nth-child(3) { background: linear-gradient(135deg, #0f2027, #2c5364); }

    .test-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 40px rgba(0,0,0,0.2); }

    .test-card .card-emoji { font-size: 2.4rem; margin-bottom: 8px; display: block; }
    .test-card h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 4px; }
    .test-card .test-type { font-size: 0.78rem; opacity: 0.9; margin-bottom: 12px; background: rgba(255,255,255,0.25); border-radius: 99px; padding: 2px 10px; display: inline-block; }
    .test-card .best-score { font-size: 0.85rem; opacity: 0.95; }
    .test-card .best-score span { font-weight: 800; font-size: 1rem; }

    .quiz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .quiz-back { background: #f7fafc; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 1rem; color: #4a5568; transition: background 0.15s; }
    .quiz-back:hover { background: #edf2f7; }
    .quiz-title-wrap { flex: 1; }
    .quiz-title-wrap h2 { font-size: 1.2rem; font-weight: 800; color: #2d3748; }
    .quiz-title-wrap p  { font-size: 0.8rem; color: #718096; }

    .progress-wrap { margin-bottom: 20px; }
    .progress-top  { display: flex; justify-content: space-between; font-size: 0.82rem; color: #718096; margin-bottom: 6px; }
    .progress-bar-bg { background: #edf2f7; border-radius: 99px; height: 10px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      transition: width 0.5s cubic-bezier(.34,1.56,.64,1);
    }

    .scenario {
      background: linear-gradient(135deg, #f7f8ff, #fffbea);
      border-left: 5px solid #f7971e;
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 1.05rem;
      color: #2d3748;
      line-height: 1.7;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .choices { display: flex; flex-direction: column; gap: 10px; }

    .choice-btn {
      border: 2.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      text-align: left;
      background: #fff;
      transition: all 0.15s;
      width: 100%;
      font-size: 0.93rem;
      color: #2d3748;
      line-height: 1.5;
      font-family: inherit;
    }

    .choice-btn:not([disabled]):hover { border-color: #f7971e; background: #fffbea; transform: translateX(4px); }
    .choice-btn.correct { border-color: #38a169; background: linear-gradient(135deg, #f0fff4, #c6f6d5); animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1); }
    .choice-btn.wrong   { border-color: #e53e3e; background: linear-gradient(135deg, #fff5f5, #fed7d7); animation: shake 0.4s ease; }
    .choice-btn.reveal  { border-color: #38a169; background: linear-gradient(135deg, #f0fff4, #c6f6d5); }

    @keyframes popIn  { 0% { transform: scale(0.95); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
    @keyframes shake  { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

    .feedback {
      margin-top: 16px; padding: 14px 18px; border-radius: 12px;
      font-size: 1rem; font-weight: 800; display: none;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .feedback.correct { background: linear-gradient(135deg, #f0fff4, #c6f6d5); color: #276749; display: block; }
    .feedback.wrong   { background: linear-gradient(135deg, #fff5f5, #fed7d7); color: #9b2c2c; display: block; }

    .next-btn {
      margin-top: 18px; width: 100%; padding: 15px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #2d3748; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer; display: none;
      transition: all 0.2s; font-family: inherit; letter-spacing: 0.03em;
    }
    .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(247,151,30,0.4); }

    .result-header { text-align: center; margin-bottom: 24px; }
    .result-header h1 { font-size: 1.6rem; font-weight: 800; color: #2d3748; }

    .score-ring {
      width: 160px; height: 160px; border-radius: 50%;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 12px 40px rgba(247,151,30,0.4);
      animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
    }
    .score-num  { font-size: 2.8rem; font-weight: 900; color: #2d3748; line-height: 1; }
    .score-unit { font-size: 0.9rem; color: rgba(45,55,72,0.75); }
    .score-area { text-align: center; margin: 28px 0; }
    .score-stars { font-size: 1.6rem; letter-spacing: 4px; margin-bottom: 8px; }
    .score-msg   { font-size: 1.15rem; font-weight: 700; color: #2d3748; margin-bottom: 6px; }
    .best-msg    { font-size: 0.9rem; color: #d69e2e; font-weight: 700; }

    .result-list { border-top: 2px solid #edf2f7; margin-top: 24px; padding-top: 20px; }
    .result-list h3 { font-size: 0.95rem; color: #718096; margin-bottom: 14px; font-weight: 700; }
    .answer-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f7fafc; font-size: 0.84rem; }
    .q-num  { min-width: 32px; font-weight: 800; color: #a0aec0; }
    .mark   { font-size: 1.2rem; min-width: 24px; }
    .answer-detail { color: #2d3748; line-height: 1.7; flex: 1; }

    .btn-home {
      margin-top: 24px; width: 100%; padding: 15px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #2d3748; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(247,151,30,0.4); }

    .confetti-wrap { position: fixed; top: 0; left: 0; right: 0; pointer-events: none; overflow: hidden; height: 100vh; z-index: 9999; }
    .confetti-piece { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: confettiFall linear forwards; }
    @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

    .home-top { position: relative; }
    .btn-reset-corner {
      position: absolute; top: 0; right: 0;
      background: transparent; color: #e53e3e; border: 2px solid #e53e3e;

      cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap;
    }
    .btn-reset-corner:hover { background: #fff5f5; transform: translateY(-1px); }
    .hidden { display: none !important; }
  </style>
</head>

<script>
const AC = window.AudioContext || window.webkitAudioContext;
let ac = null;
function getAC() { if (!ac) ac = new AC(); if (ac.state === 'suspended') ac.resume(); return ac; }
function tone(freq, type, start, dur, vol = 0.25) {
  try {
    const a = getAC(), osc = a.createOscillator(), gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, a.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + start + dur);
    osc.start(a.currentTime + start); osc.stop(a.currentTime + start + dur);
  } catch(e) {}
}
function soundCorrect() { tone(660,'sine',0,0.12,0.25); tone(880,'sine',0.08,0.15,0.25); tone(1100,'sine',0.18,0.18,0.20); }
function soundWrong()   { tone(330,'sawtooth',0,0.10,0.20); tone(220,'sawtooth',0.08,0.18,0.15); }
function soundClick()   { tone(1000,'sine',0,0.05,0.10); }
function soundFanfare() { [[523,0],[659,0.15],[784,0.30],[1047,0.45],[1047,0.60],[784,0.70],[1047,0.82]].forEach(([f,t]) => tone(f,'sine',t,0.18,0.28)); }
function soundGood()    { tone(784,'sine',0,0.15,0.25); tone(1047,'sine',0.14,0.20,0.25); }

function launchConfetti(count = 60) {
  const wrap = document.getElementById('confetti-wrap');
  wrap.innerHTML = '';
  const colors = ['#f7971e','#ffd200','#21d4fd','#b721ff','#0f2027','#38a169','#f5576c'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.8) + 's';
    el.style.width = el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    wrap.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

      choices: ['AWSアカウントで実行されたAPI呼び出しを記録・監査する', 'アプリのパフォーマンスを監視する', 'EC2のシステムログを収集する', 'コードの変更履歴を管理する'], correct: 0 },
    { scenario: '🔍 CloudWatch Logs Insights の用途は何？',
      choices: ['CloudWatch Logsのログデータをクエリ言語で検索・分析する', 'EC2にSSH接続する', 'CloudFormationテンプレートのエラーを検出する', 'S3バケットのアクセスログを管理する'], correct: 0 },
    { scenario: '🛡️ Amazon GuardDuty の説明として正しいのは？',
      choices: ['脅威インテリジェンスを活用してAWSアカウントの悪意ある活動を自動検出する', 'アプリのパフォーマンス最適化サービス', 'インフラのコスト管理サービス', 'コードの静的解析サービス'], correct: 0 },
    { scenario: '🛠️ AWS Systems Manager OpsCenter の目的は何？',
      choices: ['運用上の問題（OpsItems）を一元管理・調査・解決する', 'EC2へのパッチ適用を自動化する', 'CloudFormationスタックを管理する', 'ビルドログを保存する'], correct: 0 },
    { scenario: '🔔 CloudWatch Composite Alarms の特徴として正しいのは？',
      choices: ['複数のアラームを AND/OR 条件で組み合わせて1つのアラームとして管理できる', '自動的にEC2インスタンスを再起動する', 'ログデータを自動的にS3に転送する', 'コスト超過アラートを設定する'], correct: 0 },
    { scenario: '🏥 AWS Health Dashboard の目的として正しいのは？',
      choices: ['AWSサービスの障害情報や自アカウントへの影響を確認する', 'EC2のヘルスチェックを設定する', 'アプリの死活監視を行う', 'Auto Scalingのスケーリング履歴を確認する'], correct: 0 },
  ],
};

const TESTS = [TEST1, TEST2, TEST3];

let currentTest = null, currentQ = 0, answers = [], shuffledChoices = [];

function getBest(id)    { return parseInt(localStorage.getItem(`best_${id}`) || '0', 10); }
function setBest(id, s) { if (s > getBest(id)) localStorage.setItem(`best_${id}`, s); }
function resetScores() {
  if (!confirm('🗑️ 全テストの最高得点をリセットしますか？')) return;
  TESTS.forEach(t => localStorage.removeItem(`best_${t.id}`));
  soundClick(); showHome();
}

function showHome() {
  document.getElementById('screen-home').classList.remove('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('test-grid').innerHTML = TESTS.map(t => {
    const best = getBest(t.id);
    const bestTxt = best > 0 ? `🏆 最高 <span>${best}点</span>` : '🔰 未挑戦';
    return `<div class="test-card" onclick="startTest(${t.id}); soundClick();">
      <span class="card-emoji">${t.emoji}</span>
      <h2>${t.title}</h2>
      <span class="test-type">${t.type}</span>
      <p class="best-score">${bestTxt}</p>
    </div>`;
  }).join('');
}

function startTest(id) {
  currentTest = TESTS.find(t => t.id === id);
  currentQ = 0; answers = [];
  document.getElementById('screen-home').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  renderQuestion();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CORRECT_MSGS = ['✅ 正解！やったね！', '🎯 その通り！完璧！', '⭐ 正解！さすが！', '🌟 正解！いい感じ！', '💫 正解！よくできました！'];
const WRONG_MSGS   = ['❌ 残念...もう一度確認しよう！', '💔 惜しい！正解を確認してね', '😅 不正解...次はがんばろう！', '🔄 違うよ！正解をチェックしてね'];

function renderQuestion() {
  const q = currentTest.questions[currentQ];
  const total = currentTest.questions.length;
  const pct = Math.round((currentQ / total) * 100);

  document.getElementById('quiz-title').textContent    = currentTest.title;
  document.getElementById('quiz-subtitle').textContent = currentTest.subtitle;
  document.getElementById('progress-bar').style.width  = pct + '%';
  document.getElementById('progress-label').textContent = `第 ${currentQ + 1} 問 ／ ${total} 問`;
  document.getElementById('progress-pct').textContent   = pct + '%';
  document.getElementById('scenario').textContent       = q.scenario;
  document.getElementById('feedback').className         = 'feedback';
  document.getElementById('next-btn').style.display     = 'none';

  const indexed = shuffle(q.choices.map((c, i) => ({ choice: c, origIdx: i })));
  shuffledChoices = indexed;
  const correctShuffledIdx = indexed.findIndex(x => x.origIdx === q.correct);

  document.getElementById('choices').innerHTML = indexed.map((item, i) =>
    `<button class="choice-btn" onclick="answer(${i},${correctShuffledIdx})" id="choice-${i}">${item.choice}</button>`
  ).join('');
}

function answer(idx, correctIdx) {
  const ok = idx === correctIdx;
  answers.push({ correct: ok, chosenOrigIdx: shuffledChoices[idx].origIdx });

  shuffledChoices.forEach((_, i) => { document.getElementById(`choice-${i}`).disabled = true; });
  document.getElementById(`choice-${idx}`).classList.add(ok ? 'correct' : 'wrong');
  if (!ok) document.getElementById(`choice-${correctIdx}`).classList.add('reveal');

  const fb = document.getElementById('feedback');
  fb.className = `feedback ${ok ? 'correct' : 'wrong'}`;
  fb.textContent = ok
    ? CORRECT_MSGS[Math.floor(Math.random() * CORRECT_MSGS.length)]
    : WRONG_MSGS[Math.floor(Math.random() * WRONG_MSGS.length)];

  ok ? soundCorrect() : soundWrong();

  const nb = document.getElementById('next-btn');
  nb.style.display = 'block';
  const isLast = currentQ === currentTest.questions.length - 1;
  nb.textContent = isLast ? '📊 結果を見る →' : '➡️ 次の問題';
  nb.onclick = () => { soundClick(); isLast ? showResults() : nextQuestion(); };
}

function nextQuestion() { currentQ++; renderQuestion(); }

function showResults() {
  const total   = currentTest.questions.length;
  const correct = answers.filter(a => a.correct).length;
  const score   = Math.round((correct / total) * 100);
  setBest(currentTest.id, score);
  const best  = getBest(currentTest.id);
  const isNew = score > 0 && score >= best;

  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');
  document.getElementById('result-title').textContent = currentTest.title + ' 結果 🎉';
  document.getElementById('score-num').textContent    = score;

  const stars = score === 100 ? '⭐⭐⭐' : score >= 70 ? '⭐⭐' : score >= 40 ? '⭐' : '　';
  document.getElementById('score-stars').textContent = stars;
  document.getElementById('score-msg').textContent =
    score === 100 ? '🏆 満点！AWS天才！！' :
    score >= 80   ? '🌟 すごい！もう少しで満点！' :
    score >= 60   ? '💪 惜しい！もう一息！' :
    score >= 40   ? '📚 まだまだ！復習してみよう！' :
                    '😅 ん〜、一緒にがんばろう！';
  document.getElementById('best-msg').textContent =
    `🏅 最高得点: ${best}点${isNew ? '（🔥 更新！）' : ''}`;

  if (score === 100) { soundFanfare(); setTimeout(() => launchConfetti(80), 300); }
  else if (score >= 70) { soundGood(); setTimeout(() => launchConfetti(30), 300); }
  else soundClick();

  document.getElementById('answer-list').innerHTML = currentTest.questions.map((q, i) => {
    const ans         = answers[i];
    const correctText = q.choices[q.correct];
    const chosenText  = q.choices[ans.chosenOrigIdx];
    let detail = `<span>${q.scenario}</span><br><span style="color:#555;font-size:0.82rem">正解: ${correctText}</span>`;
    if (!ans.correct) detail += `<br><span style="color:#e53e3e;font-size:0.82rem">あなた: ${chosenText}</span>`;
    return `<div class="answer-row">
      <span class="q-num">Q${i + 1}</span>
      <span class="mark">${ans.correct ? '✅' : '❌'}</span>
      <div class="answer-detail">${detail}</div>
    </div>`;
  }).join('');
}

showHome();
</script>
</body>
</html>
